<style>
  :root{
    --brown:#8B6F4D;
    --brown-dark:#6B5439;
    --brown-deep:#4A3B28;
    --ink:#211A12;
    --paper:#FBF7F1;
    --card:#FFFFFF;
    --tan-light:#F1E6D6;
    --tan-mid:#E4D3B8;
    --border:#E1D2BC;
    --rust:#A8493B;
    --rust-dark:#8B3A2F;
    --green:#5B7B54;
    --muted:#8A7B65;
    --shadow: rgba(33,26,18,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    padding-bottom:40px;
  }
  ::selection{background:var(--tan-mid);}

  /* ---------- Header ---------- */
  .brand-header{
    background:var(--brown);
    padding:28px 20px 22px;
    text-align:center;
    position:relative;
    box-shadow:0 6px 18px var(--shadow);
  }
  .brand-header .settings-btn{
    position:absolute;
    top:16px;
    right:16px;
    background:rgba(255,255,255,0.16);
    border:1px solid rgba(255,255,255,0.35);
    color:#fff;
    width:38px;height:38px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:17px;
    transition:background .15s;
  }
  .brand-header .settings-btn:hover{background:rgba(255,255,255,0.3);}
  .brand-name{
    font-family:'Playfair Display',serif;
    font-weight:800;
    font-size:38px;
    letter-spacing:4px;
    color:#fff;
    margin:0;
    line-height:1;
  }
  .brand-sub{
    font-family:'Playfair Display',serif;
    font-size:12px;
    letter-spacing:5px;
    color:rgba(255,255,255,0.85);
    margin-top:6px;
    font-weight:500;
  }
  .brand-meta{
    margin-top:10px;
    font-size:12px;
    color:rgba(255,255,255,0.8);
    display:flex;
    gap:14px;
    justify-content:center;
    flex-wrap:wrap;
  }

  /* ---------- Tabs ---------- */
  .tabbar{
    display:flex;
    max-width:900px;
    margin:18px auto 0;
    padding:0 16px;
    gap:8px;
  }
  .tab-btn{
    flex:1;
    padding:12px 10px;
    text-align:center;
    background:var(--tan-light);
    border:1px solid var(--border);
    border-radius:10px;
    font-weight:600;
    font-size:14px;
    color:var(--brown-deep);
    cursor:pointer;
    transition:all .15s;
  }
  .tab-btn.active{
    background:var(--brown);
    color:#fff;
    border-color:var(--brown);
  }

  .container{
    max-width:900px;
    margin:0 auto;
    padding:16px;
  }

  /* ---------- Cards / sections ---------- */
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px;
    margin-bottom:16px;
    box-shadow:0 2px 10px var(--shadow);
  }
  .section-title{
    font-family:'Playfair Display',serif;
    font-size:19px;
    font-weight:700;
    color:var(--brown-deep);
    margin:0 0 14px;
  }
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .row > *{flex:1;min-width:140px;}

  label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--muted);
    margin-bottom:5px;
  }
  input, select, textarea{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:9px;
    font-size:14px;
    font-family:inherit;
    background:#fff;
    color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{
    outline:none;
    border-color:var(--brown);
  }
  .field{margin-bottom:12px;}

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:11px 18px;
    border-radius:9px;
    border:none;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    transition:opacity .15s, transform .1s;
    font-family:inherit;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--brown); color:#fff;}
  .btn-primary:hover{background:var(--brown-dark);}
  .btn-outline{background:transparent; border:1px solid var(--brown); color:var(--brown-deep);}
  .btn-outline:hover{background:var(--tan-light);}
  .btn-rust{background:var(--rust); color:#fff;}
  .btn-rust:hover{background:var(--rust-dark);}
  .btn-ghost{background:var(--tan-light); color:var(--brown-deep);}
  .btn-sm{padding:7px 12px; font-size:12.5px; border-radius:7px;}
  .btn-block{width:100%;}

  .search-row{
    display:flex;
    gap:10px;
    margin-bottom:16px;
  }
  .search-row input{flex:1;}

  /* ---------- Order item chips ---------- */
  .item-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--tan-light);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
    margin-bottom:8px;
    gap:10px;
  }
  .item-row .info{flex:1; font-size:13.5px;}
  .item-row .info b{color:var(--brown-deep);}
  .item-row .tags{font-size:12px; color:var(--muted); margin-top:2px;}
  .item-row .price{font-weight:700; color:var(--ink); white-space:nowrap; font-size:13.5px;}
  .item-row .del-x{
    background:none;border:none;color:var(--rust);
    font-size:18px;cursor:pointer;padding:2px 6px;line-height:1;
  }
  .empty-note{
    text-align:center;
    color:var(--muted);
    font-size:13.5px;
    padding:18px 10px;
  }
  .total-line{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-top:12px;
    margin-top:6px;
    border-top:1px dashed var(--border);
    font-size:16px;
    font-weight:700;
    color:var(--brown-deep);
  }

  /* ---------- Order list ---------- */
  .order-card{
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    margin-bottom:10px;
    background:var(--card);
  }
  .order-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .voucher-tag{
    font-family:'Playfair Display',serif;
    font-weight:700;
    font-size:15px;
    color:var(--brown-deep);
    letter-spacing:0.5px;
  }
  .order-meta{font-size:12.5px; color:var(--muted); margin-top:3px;}
  .status-badge{
    font-size:11px;
    font-weight:700;
    padding:4px 10px;
    border-radius:20px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    white-space:nowrap;
  }
  .status-active{background:#E9F0E6; color:var(--green);}
  .status-cancelled{background:#F5E4E1; color:var(--rust);}
  .order-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid var(--border);
  }
  .order-total{font-weight:700; color:var(--ink);}
  .order-actions{display:flex; gap:8px;}

  /* ---------- Stock table ---------- */
  .stock-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    border:1px solid var(--border);
    border-radius:10px;
    padding:11px 13px;
    margin-bottom:8px;
    gap:10px;
  }
  .stock-item .info b{color:var(--brown-deep); font-size:14px;}
  .stock-item .tags{font-size:12px; color:var(--muted); margin-top:2px;}
  .stock-qty{
    font-weight:700;
    font-size:15px;
    min-width:56px;
    text-align:center;
  }
  .stock-qty.low{color:var(--rust);}
  .stock-actions{display:flex; gap:6px;}
  .size-row{align-items:flex-end; margin-bottom:4px;}
  .size-row .field{margin-bottom:0;}
  .icon-btn{
    width:32px;height:32px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:14px;
    color:var(--brown-deep);
  }
  .icon-btn.danger{color:var(--rust); border-color:#E9CFC9;}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(33,26,18,0.45);
    display:none;
    align-items:flex-end;
    justify-content:center;

<body>

<div id="passwordGate" style="display:flex; min-height:100vh; align-items:center; justify-content:center; background:var(--paper); flex-direction:column; padding:24px;">
  <div style="width:100%; max-width:340px; text-align:center;">

<div class="container">

  <!-- ORDERS TAB -->
  <div id="ordersTab">

    <div class="card">
      <div class="section-title">Voucher အသစ်ရေးရန်</div>
      <div class="row">

        <div class="field"><label>ဖုန်းနံပါတ် (Ph No)</label><input id="ordPhone" placeholder="09xxxxxxxxx"></div>
      </div>
      <div class="field"><label>လိပ်စာ (Address)</label><textarea id="ordAddress" rows="2" placeholder="ပို့ဆောင်ရန်လိပ်စာ"></textarea></div>

      <div class="field" style="margin-top:12px;"><label>စရံငွေ (Deposit) Ks</label><input id="ordDeposit" type="number" min="0" placeholder="0" oninput="renderOrderItems()"></div>

      <div class="total-line" style="flex-direction:column; align-items:stretch; gap:5px; border-top:1px dashed var(--border);">

    <div class="card">

<!-- Add Item Modal -->

    <div class="receipt-divider"></div>

      <div class="field"><label>Size</label><input id="customSize"></div>

      <div class="field"><label>Qty</label><input id="customQty" type="number" min="1" value="1"></div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal-box">
    <div class="modal-head"><h3>ဆိုင်အချက်အလက်</h3><button class="close-x" onclick="closeModal('settingsModal')">×</button></div>
    <div class="field"><label>ဆိုင်နာမည် (Shop Name)</label><input id="setShopName"></div>
    <div class="field"><label>ဆိုင်လိပ်စာ (Address)</label><textarea id="setShopAddress" rows="2"></textarea></div>
    <div class="field"><label>ဖုန်းနံပါတ် (Phone)</label><input id="setShopPhone"></div>
    <div class="field"><label>Voucher Prefix</label><input id="setVoucherPrefix" maxlength="6" style="text-transform:uppercase;"></div>
    <button class="btn btn-primary btn-block" onclick="saveSettings()">Save</button>
    <div class="receipt-divider"></div>
    <div class="field"><label>Password အသစ်ပြောင်းရန် (ဝန်ထမ်းအားလုံးအတွက်)</label><input id="setNewPassword" type="password" placeholder="Password အသစ်"></div>
    <button class="btn btn-outline btn-block" onclick="changePassword()">Password ပြောင်းမည်</button>
    <button class="btn btn-ghost btn-block" style="margin-top:8px;" onclick="logout()">ထွက်မည် (Logout)</button>
  </div>
</div>

<!-- Voucher Detail Modal -->
<div class="modal-overlay" id="detailModal">
  <div class="modal-box">
    <div class="modal-head"><h3>Voucher Detail</h3><button class="close-x" onclick="closeModal('detailModal')">×</button></div>
    <div id="detailContent"></div>
    <button class="btn btn-primary btn-block" style="margin-top:14px;" onclick="saveVoucherAsImage()">📷 Voucher ကို Photo အဖြစ် Save မည်</button>
  </div>
</div>

<div class="toast" id="toast"></div>
</div>

<script>
let settings = { shopName:'BALANCE CLOTHING', shopAddress:'', shopPhone:'', voucherPrefix:'BAL', voucherCounter:1 };
let stock = [];
let orders = [];
let currentOrderItems = [];
let pickedStockId = null;
let currentTab = 'orders';
let currentViewingVoucher = null;

function uid(){ return 'id_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }
function fmt(n){ return (Number(n)||0).toLocaleString('en-US'); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

const firebaseConfig = {
  apiKey: "AIzaSyDpk6oDLJ0mF_hr2-hgFEmMTIGqtzWSJBQ",
  authDomain: "balance-clothing.firebaseapp.com",
  projectId: "balance-clothing",
  storageBucket: "balance-clothing.firebasestorage.app",
  messagingSenderId: "1006420514944",
  appId: "1:1006420514944:web:bdab5107ac1469f77a2e65"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const fbAuth = firebase.auth();

const DEFAULT_PASSWORD = 'balance2026';
const LOGIN_FLAG_KEY = 'balanceClothing_loggedIn';
let dataUnsub = null;

function showGate(msg){
  document.getElementById('gateError').textContent = msg || '';
  document.getElementById('passwordGate').style.display = 'flex';
  document.getElementById('appRoot').style.display = 'none';
}
function showAppUI(){
  document.getElementById('passwordGate').style.display = 'none';
  document.getElementById('appRoot').style.display = 'block';
}

async function ensureAuthDoc(){
  const ref = db.collection('shop').doc('auth');
  const snap = await ref.get();
  if(!snap.exists){
    await ref.set({ password: DEFAULT_PASSWORD });
    return DEFAULT_PASSWORD;
  }
  return snap.data().password;
}

async function tryLogin(){
  const input = document.getElementById('gatePasswordInput');
  const val = input.value.trim();
  const errEl = document.getElementById('gateError');
  if(!val){ errEl.textContent='Password ထည့်ပါ'; return; }
  errEl.textContent='စစ်ဆေးနေသည်...';
  try{
    const current = await ensureAuthDoc();
    if(val === current){
      localStorage.setItem(LOGIN_FLAG_KEY, 'true');
      errEl.textContent='';
      input.value='';
      startApp();
    }else{
      errEl.textContent='Password မှားနေပါသည်';
    }
  }catch(e){
    errEl.textContent='ချိတ်ဆက်မှု မအောင်မြင်ပါ — Internet စစ်ကြည့်ပါ';
  }
}

async function changePassword(){
  const val = document.getElementById('setNewPassword').value.trim();
  if(!val || val.length < 4){ showToast('Password အနည်းဆုံး 4 လုံး ထည့်ပါ'); return; }
  try{
    await db.collection('shop').doc('auth').set({ password: val }, { merge: true });
    document.getElementById('setNewPassword').value='';
    showToast('Password ပြောင်းပြီးပါပြီ');
  }catch(e){
    showToast('Password ပြောင်းရာတွင် အမှားရှိပါသည်');
  }
}

function logout(){
  localStorage.removeItem(LOGIN_FLAG_KEY);
  if(dataUnsub) dataUnsub();
  location.reload();
}

function startDataSync(){
  dataUnsub = db.collection('shop').doc('main').onSnapshot((snap) => {
    const d = snap.data() || {};
    if(d.settings) settings = d.settings;
    stock = d.stock || [];
    orders = d.orders || [];
    renderHeader();
    renderOrders();
    renderStock();
  }, (err) => {
    showToast('Sync error — Internet ချိတ်ဆက်မှု စစ်ကြည့်ပါ');
  });
}

function startApp(){
  showAppUI();
  startDataSync();
}

async function persist(key, data){
  try{
    await db.collection('shop').doc('main').set({ [key]: data }, { merge: true });
  }catch(e){
    showToast('Sync error — Internet ချိတ်ဆက်မှု စစ်ကြည့်ပါ');
  }
}

async function persistAll(changes){
  try{
    await db.collection('shop').doc('main').set(changes, { merge: true });
  }catch(e){
    showToast('Sync error — Internet ချိတ်ဆက်မှု စစ်ကြည့်ပါ');
  }
}

function renderHeader(){
  const parts = settings.shopName.split(' ');
  document.getElementById('hdrName').textContent = settings.shopName.split('\n')[0] || 'BALANCE';
  document.getElementById('hdrSub').textContent = 'CLOTHING';
  const meta = [];
  if(settings.shopAddress) meta.push(settings.shopAddress);
  if(settings.shopPhone) meta.push('☎ ' + settings.shopPhone);
  document.getElementById('hdrMeta').textContent = meta.join('   |   ');
  document.getElementById('setShopName').value = settings.shopName;
  document.getElementById('setShopAddress').value = settings.shopAddress;
  document.getElementById('setShopPhone').value = settings.shopPhone;
  document.getElementById('setVoucherPrefix').value = settings.voucherPrefix;
}

function switchTab(tab){
  currentTab = tab;
  document.getElementById('ordersTab').style.display = tab==='orders' ? 'block' : 'none';
  document.getElementById('stockTab').style.display = tab==='stock' ? 'block' : 'none';
  document.getElementById('tabOrdersBtn').classList.toggle('active', tab==='orders');
  document.getElementById('tabStockBtn').classList.toggle('active', tab==='stock');
}

function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }

/* ---------------- SETTINGS ---------------- */
function openSettings(){ openModal('settingsModal'); }
async function saveSettings(){
  settings.shopName = document.getElementById('setShopName').value.trim() || 'BALANCE CLOTHING';
  settings.shopAddress = document.getElementById('setShopAddress').value.trim();
  settings.shopPhone = document.getElementById('setShopPhone').value.trim();
  settings.voucherPrefix = (document.getElementById('setVoucherPrefix').value.trim() || 'BAL').toUpperCase();
  await persist('settings', settings);
  renderHeader();
  closeModal('settingsModal');
  showToast('ဆိုင်အချက်အလက် သိမ်းပြီးပါပြီ');
}

/* ---------------- STOCK ---------------- */
function addSizeRow(size='', qty=''){
  const div = document.createElement('div');
  div.className='row size-row';
  div.innerHTML = `
    <div class="field"><label>Size</label><input class="szSize" placeholder="M" value="${escapeHtml(size)}"></div>
    <div class="field"><label>Qty</label><input class="szQty" type="number" min="0" placeholder="10" value="${qty}"></div>
    <button type="button" class="icon-btn danger" onclick="this.parentElement.remove()">🗑</button>
  `;
  document.getElementById('stkSizeRows').appendChild(div);
}

async function addStock(){
  const name = document.getElementById('stkName').value.trim();
  const color = document.getElementById('stkColor').value.trim();
  const price = Number(document.getElementById('stkPrice').value);
  if(!name){ showToast('ပစ္စည်းအမည် ထည့်ပါ'); return; }
  if(!price || price < 0){ showToast('Price မှန်ကန်စွာ ထည့်ပါ'); return; }

  const rows = Array.from(document.querySelectorAll('#stkSizeRows .size-row'));
  if(rows.length===0){ showToast('Size တစ်ခုမျှ ထည့်မထားပါ'); return; }

  // gather + merge duplicate sizes within this batch
  const batch = {};
  for(const row of rows){
    const size = row.querySelector('.szSize').value.trim();
    const qty = Number(row.querySelector('.szQty').value);
    if(!qty || qty <= 0) continue;
    const key = size.toLowerCase();
    if(!batch[key]) batch[key] = { size, qty:0 };
    batch[key].qty += qty;
  }
  const entries = Object.values(batch);
  if(entries.length===0){ showToast('Size တစ်ခုစီအတွက် Qty ထည့်ပါ'); return; }

  for(const e of entries){
    const existing = stock.find(s =>
      s.name.trim().toLowerCase()===name.toLowerCase() &&
      (s.color||'').trim().toLowerCase()===color.toLowerCase() &&
      (s.size||'').trim().toLowerCase()===e.size.toLowerCase()
    );
    if(existing){
      existing.qty += e.qty;
      existing.price = price;
    }else{
      stock.push({ id: uid(), name, color, size: e.size, price, qty: e.qty });
    }
  }

  await persist('stock', stock);
  document.getElementById('stkName').value='';
  document.getElementById('stkColor').value='';
  document.getElementById('stkPrice').value='';
  document.getElementById('stkSizeRows').innerHTML='';
  addSizeRow();
  renderStock();
  showToast(`Stock ထည့်ပြီးပါပြီ (${entries.length} size)`);
}

const expandedStockGroups = new Set();

function toggleStockGroup(key){
  if(expandedStockGroups.has(key)) expandedStockGroups.delete(key);
  else expandedStockGroups.add(key);
  renderStock();
}

function getStockGroupsRaw(){
  const groups = {};
  for(const s of stock){
    const key = groupKeyFor(s);
    if(!groups[key]) groups[key] = { key, name: s.name, color: s.color, variants: [], totalQty: 0 };
    groups[key].variants.push(s);
    groups[key].totalQty += s.qty;
  }
  return Object.values(groups);
}

function renderStock(){
  const el = document.getElementById('stockList');
  if(stock.length === 0){ el.innerHTML = '<div class="empty-note">Stock မရှိသေးပါ</div>'; return; }
  const groups = getStockGroupsRaw();
  el.innerHTML = groups.map(g => {
    const expanded = expandedStockGroups.has(g.key);
    const variantsHtml = expanded ? g.variants.map(s => `
      <div class="stock-item" style="margin-left:16px; background:var(--tan-light);">
        <div class="info">
          <b>${escapeHtml(s.size||'-')}</b>
          <div class="tags">${fmt(s.price)} Ks</div>
        </div>
        <div class="stock-qty ${s.qty<=2 ? 'low' : ''}">${s.qty}</div>
        <div class="stock-actions">
          <button class="icon-btn" onclick="editStock('${s.id}')" title="Edit">✎</button>
          <button class="icon-btn danger" onclick="deleteStock('${s.id}')" title="Delete">🗑</button>
        </div>
      </div>
    `).join('') : '';
    return `
      <div class="stock-item" style="cursor:pointer;" onclick="toggleStockGroup('${g.key.replace(/'/g,"\\'")}')">
        <div class="info">
          <b>${escapeHtml(g.name)}</b>
          <div class="tags">${escapeHtml(g.color||'-')} &nbsp;•&nbsp; ${g.variants.length} size ${expanded ? '▲ ပိတ်ရန်' : '▼ ကြည့်ရန်'}</div>
        </div>
        <div class="stock-qty ${g.totalQty<=2 ? 'low' : ''}">${g.totalQty}</div>
      </div>
      ${variantsHtml}
    `;
  }).join('');
}

function editStock(id){
  const s = stock.find(x=>x.id===id);
  if(!s) return;
  const newQty = prompt(`"${s.name}" (${s.color}/${s.size}) — Qty အသစ်:`, s.qty);
  if(newQty === null) return;
  const q = Number(newQty);
  if(isNaN(q) || q < 0){ showToast('Qty မှန်ကန်စွာ ထည့်ပါ'); return; }
  s.qty = q;
  persist('stock', stock);
  renderStock();
}

function deleteStock(id){
  if(!confirm('ဒီ stock item ကို ဖျက်မှာ သေချာပါသလား?')) return;
  stock = stock.filter(x=>x.id!==id);
  persist('stock', stock);
  renderStock();
}

/* ---------------- ORDER ITEM PICKER ---------------- */
let currentGroupKey = null;

function openAddItem(){
  pickedStockId = null;
  currentGroupKey = null;
  document.getElementById('itemSearchBox').value='';
  document.getElementById('itemStepGroup').style.display='block';
  document.getElementById('itemStepSize').style.display='none';
  document.getElementById('pickedItemQtyBox').style.display='none';
  document.getElementById('customDesc').value='';
  document.getElementById('customColor').value='';
  document.getElementById('customSize').value='';
  document.getElementById('customPrice').value='';
  document.getElementById('customQty').value=1;
  renderItemGroups();
  openModal('addItemModal');
}

function reservedQtyFor(stockId){
  return currentOrderItems.filter(i=>i.stockId===stockId).reduce((a,b)=>a+b.qty,0);
}

function groupKeyFor(s){
  return (s.name||'').trim().toLowerCase() + '|' + (s.color||'').trim().toLowerCase();
}

function getStockGroups(){
  const groups = {};
  for(const s of stock){
    const key = groupKeyFor(s);
    const avail = s.qty - reservedQtyFor(s.id);
    if(!groups[key]) groups[key] = { key, name: s.name, color: s.color, variants: [], totalAvail: 0 };
    groups[key].variants.push(s);
    groups[key].totalAvail += Math.max(0, avail);
  }
  return Object.values(groups).filter(g => g.totalAvail > 0);
}

function renderItemGroups(){
  const term = document.getElementById('itemSearchBox').value.trim().toLowerCase();
  let groups = getStockGroups();
  if(term){
    groups = groups.filter(g => (g.name+' '+g.color).toLowerCase().includes(term));
  }
  const el = document.getElementById('stockPickList');
  if(groups.length===0){ el.innerHTML = '<div class="empty-note">ရှာမတွေ့ပါ / stock ကုန်နေပါသည်</div>'; return; }
  el.innerHTML = groups.map(g => `
    <div class="stock-pick-row" onclick="selectItemGroup('${g.key.replace(/'/g,"\\'")}')">
      <div class="info"><b>${escapeHtml(g.name)}</b><div class="avail">${escapeHtml(g.color||'-')} • ${g.variants.length} size</div></div>
      <div class="avail">${g.totalAvail} left</div>
    </div>
  `).join('');
}

function selectItemGroup(key){
  currentGroupKey = key;
  pickedStockId = null;
  document.getElementById('pickedItemQtyBox').style.display='none';
  document.getElementById('itemStepGroup').style.display='none';
  document.getElementById('itemStepSize').style.display='block';
  renderSizeChips();
}

function backToItemList(){
  currentGroupKey = null;
  pickedStockId = null;
  document.getElementById('itemStepSize').style.display='none';
  document.getElementById('itemStepGroup').style.display='block';
  renderItemGroups();
}

function renderSizeChips(){
  const groups = getStockGroups();
  const g = groups.find(x => x.key === currentGroupKey);
  if(!g){ backToItemList(); return; }
  document.getElementById('sizeStepTitle').textContent = `${g.name}${g.color ? ' — '+g.color : ''} — Size ရွေးပါ`;
  const el = document.getElementById('sizeChipsList');
  el.innerHTML = g.variants.map(s => {
    const avail = s.qty - reservedQtyFor(s.id);
    const disabled = avail <= 0;
    return `<div class="size-chip ${pickedStockId===s.id?'selected':''} ${disabled?'disabled':''}" ${disabled?'':`onclick="selectVariant('${s.id}')"`}>
      ${escapeHtml(s.size||'-')}
      <span class="chip-avail">${avail} left</span>
    </div>`;
  }).join('');
}

function selectVariant(id){
  pickedStockId = id;
  const s = stock.find(x=>x.id===id);
  const avail = s.qty - reservedQtyFor(id);
  document.getElementById('pickQty').max = avail;
  document.getElementById('pickQty').value = 1;
  document.getElementById('pickedItemQtyBox').style.display='block';
  renderSizeChips();
}

function confirmAddItem(){
  const s = stock.find(x=>x.id===pickedStockId);
  if(!s) return;
  const avail = s.qty - reservedQtyFor(s.id);
  let qty = Number(document.getElementById('pickQty').value);
  if(!qty || qty < 1){ showToast('Qty မှန်ကန်စွာ ထည့်ပါ'); return; }
  if(qty > avail){ showToast(`Stock မလုံလောက်ပါ (${avail} ပဲကျန်ပါသည်)`); return; }
  currentOrderItems.push({ stockId: s.id, name: s.name, color: s.color, size: s.size, price: s.price, qty });
  renderOrderItems();
  closeModal('addItemModal');
}

function addCustomItem(){
  const desc = document.getElementById('customDesc').value.trim();
  const color = document.getElementById('customColor').value.trim();
  const size = document.getElementById('customSize').value.trim();
  const price = Number(document.getElementById('customPrice').value);
  const qty = Number(document.getElementById('customQty').value);
  if(!desc){ showToast('Description ထည့်ပါ'); return; }
  if(!price || price<0){ showToast('Price မှန်ကန်စွာ ထည့်ပါ'); return; }
  if(!qty || qty<1){ showToast('Qty မှန်ကန်စွာ ထည့်ပါ'); return; }
  currentOrderItems.push({ stockId: null, name: desc, color, size, price, qty });
  renderOrderItems();
  closeModal('addItemModal');
}

function removeOrderItem(idx){
  currentOrderItems.splice(idx,1);
  renderOrderItems();
}

function renderOrderItems(){
  const el = document.getElementById('orderItemsList');
  if(currentOrderItems.length===0){
    el.innerHTML = '<div class="empty-note">Item မထည့်ရသေးပါ</div>';
  }else{
    el.innerHTML = currentOrderItems.map((it,idx)=>`
      <div class="item-row">
        <div class="info">
          <b>${escapeHtml(it.name)}</b>
          <div class="tags">${escapeHtml(it.color||'-')} / ${escapeHtml(it.size||'-')} × ${it.qty}</div>
        </div>
        <div class="price">${fmt(it.price*it.qty)} Ks</div>
        <button class="del-x" onclick="removeOrderItem(${idx})">×</button>
      </div>
    `).join('');
  }
  const total = currentOrderItems.reduce((a,b)=>a+b.price*b.qty,0);
  const deposit = Number(document.getElementById('ordDeposit').value) || 0;
  const balance = total - deposit;
  document.getElementById('itemsTotalDisplay').textContent = fmt(total) + ' Ks';
  document.getElementById('depositDisplayLine').textContent = '- ' + fmt(deposit) + ' Ks';
  document.getElementById('balanceDueDisplay').textContent = fmt(balance) + ' Ks';
}

/* ---------------- ORDERS ---------------- */
async function saveOrder(){
  const name = document.getElementById('ordName').value.trim();
  const phone = document.getElementById('ordPhone').value.trim();
  const address = document.getElementById('ordAddress').value.trim();
  if(!name){ showToast('အမည် ထည့်ပါ'); return; }
  if(!phone){ showToast('ဖုန်းနံပါတ် ထည့်ပါ'); return; }
  if(currentOrderItems.length===0){ showToast('Item အနည်းဆုံး တစ်ခု ထည့်ပါ'); return; }

  // deduct stock
  for(const it of currentOrderItems){
    if(it.stockId){
      const s = stock.find(x=>x.id===it.stockId);
      if(s){
        if(s.qty < it.qty){ showToast(`"${s.name}" Stock မလုံလောက်တော့ပါ`); return; }
      }
    }
  }
  for(const it of currentOrderItems){
    if(it.stockId){
      const s = stock.find(x=>x.id===it.stockId);
      if(s) s.qty -= it.qty;
    }
  }

  const total = currentOrderItems.reduce((a,b)=>a+b.price*b.qty,0);
  const deposit = Number(document.getElementById('ordDeposit').value) || 0;
  const balance = total - deposit;
  const voucher = settings.voucherPrefix + '-' + String(settings.voucherCounter).padStart(4,'0');
  const order = {
    id: uid(),
    voucher,
    name, phone, address,
    items: currentOrderItems,
    itemsTotal: total,
    deposit,
    balanceDue: balance,
    total,
    date: new Date().toISOString(),
    status: 'active'
  };
  orders.unshift(order);
  settings.voucherCounter += 1;

  await persistAll({ stock, orders, settings });
  document.getElementById('ordName').value='';
  document.getElementById('ordPhone').value='';
  document.getElementById('ordAddress').value='';
  document.getElementById('ordDeposit').value='';
  currentOrderItems = [];
  renderOrderItems();
  renderStock();
  renderOrders();
  showToast(`Voucher ${voucher} ထုတ်ပြီးပါပြီ`);
}

function renderOrders(){
  const term = (document.getElementById('searchVoucher').value || '').trim().toLowerCase();
  let list = orders;
  if(term){
    list = orders.filter(o => o.voucher.toLowerCase().includes(term) || o.name.toLowerCase().includes(term) || o.phone.includes(term));
  }
  const el = document.getElementById('ordersList');
  if(list.length===0){ el.innerHTML = '<div class="empty-note">Voucher မတွေ့ပါ</div>'; return; }
  el.innerHTML = list.map(o=>{
    const itemsTotal = o.itemsTotal !== undefined ? o.itemsTotal : o.total;
    const deposit = o.deposit || 0;
    const balance = o.balanceDue !== undefined ? o.balanceDue : (itemsTotal - deposit);
    return `
    <div class="order-card">
      <div class="order-top">
        <div>
          <div class="voucher-tag">${escapeHtml(o.voucher)}</div>
          <div class="order-meta">${escapeHtml(o.name)} · ${escapeHtml(o.phone)}</div>
          <div class="order-meta">${new Date(o.date).toLocaleString()}</div>
        </div>
        <div class="status-badge ${o.status==='active'?'status-active':'status-cancelled'}">${o.status==='active'?'Active':'Cancelled'}</div>
      </div>
      ${deposit>0 ? `<div class="order-meta" style="margin-top:6px;">ပစ္စည်းစုစုပေါင်း ${fmt(itemsTotal)} Ks &nbsp;•&nbsp; စရံ ${fmt(deposit)} Ks</div>` : ''}
      <div class="order-bottom">
        <div class="order-total">${deposit>0 ? 'ကျန်ငွေ ' : ''}${fmt(balance)} Ks</div>
        <div class="order-actions">
          <button class="btn btn-ghost btn-sm" onclick="viewOrder('${o.id}')">View</button>
          ${o.status==='active' ? `<button class="btn btn-outline btn-sm" onclick="cancelOrder('${o.id}')">Cancel</button>` : ''}
          <button class="btn btn-rust btn-sm" onclick="deleteOrder('${o.id}')">Delete</button>
        </div>
      </div>
    </div>
  `;}).join('');
}

async function cancelOrder(id){
  const o = orders.find(x=>x.id===id);
  if(!o || o.status!=='active') return;
  if(!confirm(`Voucher ${o.voucher} ကို cancel လုပ်မှာသေချာပါသလား? Stock ပြန်ပေါင်းပေးပါမည်။`)) return;
  for(const it of o.items){
    if(it.stockId){
      const s = stock.find(x=>x.id===it.stockId);
      if(s) s.qty += it.qty;
    }
  }
  o.status = 'cancelled';
  await persistAll({ stock, orders });
  renderStock();
  renderOrders();
  showToast('Voucher cancel လုပ်ပြီး stock ပြန်ပေါင်းပြီးပါပြီ');
}

async function deleteOrder(id){
  const o = orders.find(x=>x.id===id);
  if(!o) return;
  if(!confirm(`Voucher ${o.voucher} ကို အပြီးဖျက်မှာသေချာပါသလား?`)) return;
  if(o.status==='active'){
    for(const it of o.items){
      if(it.stockId){
        const s = stock.find(x=>x.id===it.stockId);
        if(s) s.qty += it.qty;
      }
    }
  }
  orders = orders.filter(x=>x.id!==id);
  await persistAll({ stock, orders });
  renderStock();
  renderOrders();
  showToast('Voucher ဖျက်ပြီးပါပြီ');
}

function viewOrder(id){
  const o = orders.find(x=>x.id===id);
  if(!o) return;
  currentViewingVoucher = o.voucher;
  const itemsTotal = o.itemsTotal !== undefined ? o.itemsTotal : o.total;
  const deposit = o.deposit || 0;
  const balance = o.balanceDue !== undefined ? o.balanceDue : (itemsTotal - deposit);
  const itemsHtml = o.items.map(it=>`
    <div class="receipt-item">
      <div class="desc"><b>${escapeHtml(it.name)}</b><div class="tags">${escapeHtml(it.color||'-')} / ${escapeHtml(it.size||'-')} × ${it.qty}</div></div>
      <div>${fmt(it.price*it.qty)} Ks</div>
    </div>
  `).join('');
  document.getElementById('detailContent').innerHTML = `
    <div class="receipt">
      <div class="receipt-head">
        <div class="rname">${escapeHtml(settings.shopName)}</div>
        <div class="rmeta">${escapeHtml(settings.shopAddress||'')}${settings.shopPhone? ' · ☎ '+escapeHtml(settings.shopPhone):''}</div>
      </div>
      <div class="receipt-body">
        <div class="receipt-row"><span>Voucher No</span><b>${escapeHtml(o.voucher)}</b></div>
        <div class="receipt-row"><span>Date</span><span>${new Date(o.date).toLocaleString()}</span></div>
        <div class="receipt-row"><span>Status</span><span>${o.status==='active'?'Active':'Cancelled'}</span></div>
        <div class="receipt-divider"></div>
        <div class="receipt-row"><span>Name</span><span>${escapeHtml(o.name)}</span></div>
        <div class="receipt-row"><span>Phone</span><span>${escapeHtml(o.phone)}</span></div>
        <div class="receipt-row"><span>Address</span><span style="text-align:right; max-width:60%;">${escapeHtml(o.address||'-')}</span></div>
        <div class="receipt-divider"></div>
        ${itemsHtml}
        <div class="receipt-divider"></div>
        <div class="receipt-row"><span>ပစ္စည်းစုစုပေါင်း</span><span>${fmt(itemsTotal)} Ks</span></div>
        <div class="receipt-row"><span>စရံ (Deposit)</span><span>- ${fmt(deposit)} Ks</span></div>
        <div class="receipt-row" style="font-weight:700; font-size:15px;"><span>ကျန်ငွေ (Balance Due)</span><span>${fmt(balance)} Ks</span></div>
      </div>
    </div>
  `;
  openModal('detailModal');
}

async function saveVoucherAsImage(){
  const el = document.querySelector('#detailContent .receipt');
  if(!el){ showToast('Voucher မတွေ့ပါ'); return; }
  if(typeof html2canvas === 'undefined'){ showToast('Photo tool load မဖြစ်သေးပါ၊ ခဏနေမှ ထပ်ကြိုးစားပါ'); return; }
  try{
    showToast('Photo ပြင်ဆင်နေသည်...');
    const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#ffffff' });
    const link = document.createElement('a');
    link.download = (currentViewingVoucher || 'voucher') + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }catch(e){
    showToast('Photo save မအောင်မြင်ပါ');
  }
}

function escapeHtml(str){
  if(str===undefined || str===null) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

  if(e.key === 'Enter') tryLogin();

});

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
